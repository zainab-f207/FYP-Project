services:
  - type: web
    name: safevision-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: CrimeVision/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main_enhanced_final_fixed:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # ── Database (TiDB Cloud Serverless) — fill in via Render dashboard ──
      # TiDB connection details come from tidbcloud.com → Connect → Standard.
      # Note: DB_PORT is 4000 (not 3306) and DB_USER is "<cluster_id>.root".
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # TiDB Cloud requires TLS. The CA bundle is auto-detected on Render.
      - key: DB_SSL_DISABLED
        value: "false"

      # ── CORS (set to your Vercel URL) ──
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: BACKEND_URL
        sync: false

      # ── JWT secrets (REQUIRED — generate with: python -c "import secrets;print(secrets.token_urlsafe(64))") ──
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      # ── SMTP (Gmail app passwords) ──
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: AUTH_EMAIL_USERNAME
        sync: false
      - key: AUTH_EMAIL_PASSWORD
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERTS_EMAIL_USERNAME
        sync: false
      - key: ALERTS_EMAIL_PASSWORD
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false

      # ── Google OAuth ──
      - key: GOOGLE_CLIENT_ID
        sync: false

      # ── Browser push (VAPID) ──
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

      # ── Law section verification (Groq → OpenRouter chain) ──
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      # ── OCR vision APIs (at least one is required for FIR OCR) ──
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: pixtral-12b-2409
      - key: OPENROUTER_API_KEY_For_Extraction
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-exp:free

      # ── Alert tuning (defaults match local dev) ──
      - key: SAFE_AREA_MIN_SCORE
        value: "70"
      - key: SEND_SAFE_ALERTS
        value: "True"
      - key: SAFE_ALERT_COOLDOWN
        value: "60"
