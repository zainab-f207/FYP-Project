services:
  - type: web
    name: crimevision-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: CrimeVision/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main_enhanced_final_fixed:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # ── Database (db4free.net) — fill in via Render dashboard ──
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false

      # ── CORS (set to your Vercel URL) ──
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: BACKEND_URL
        sync: false

      # ── JWT secrets (REQUIRED — generate with: python -c "import secrets;print(secrets.token_urlsafe(64))") ──
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      # ── SMTP (Gmail app password) ──
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: AUTH_EMAIL_USERNAME
        sync: false
      - key: AUTH_EMAIL_PASSWORD
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false

      # ── Google OAuth ──
      - key: GOOGLE_CLIENT_ID
        sync: false

      # ── Browser push (VAPID) ──
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

      # ── OCR vision APIs (at least one is required for FIR OCR) ──
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_For_Extraction
        sync: false
