    <path d="M0 0 C70 10 120 50 120 100 C120 140 70 170 0 170 C-70 170 -120 140 -120 100 C-120 50 -70 10 0 0 Z" fill="none" stroke="url(#waveStroke)" stroke-width="10" stroke-linecap="round" stroke-dasharray="24 18" opacity="0.5" />

