<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="outerGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5f" />
      <stop offset="100%" stop-color="#4169E1" />
    </linearGradient>
    <linearGradient id="middleGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#008c8c" />
      <stop offset="100%" stop-color="#00a6a6" />
    </linearGradient>
    <radialGradient id="innerGradient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#b0fff5" />
      <stop offset="100%" stop-color="#ffc107" />
    </radialGradient>
    <pattern id="dotPattern" patternUnits="userSpaceOnUse" width="40" height="40">
      <circle cx="10" cy="10" r="3" fill="#00a6a6" opacity="0.4" />
      <circle cx="30" cy="30" r="4" fill="#ffc107" opacity="0.3" />
    </pattern>
    <pattern id="heatPattern" patternUnits="userSpaceOnUse" width="60" height="60">
      <rect width="60" height="60" fill="#ffc107" opacity="0.18" />
      <circle cx="20" cy="20" r="10" fill="#ffaa00" opacity="0.45" />
      <circle cx="42" cy="40" r="6" fill="#ffd76d" opacity="0.5" />
    </pattern>
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0b1728" />
      <stop offset="100%" stop-color="#020b16" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#backgroundGradient)" />

  <g transform="translate(400,260)">
    <path d="M0 -220 L190 -110 L190 110 L0 220 L-190 110 L-190 -110 Z" fill="none" stroke="#1a3a5f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />

    <g>
      <g opacity="0.75">
        <path d="M0 -180 C120 -160 200 -60 200 0 C200 60 120 160 0 180 C-120 160 -200 60 -200 0 C-200 -60 -120 -160 0 -180 Z" fill="none" stroke="url(#outerGradient)" stroke-width="40" stroke-linecap="round" />
      </g>
      <g opacity="0.6">
        <path d="M0 -140 C100 -120 160 -40 160 0 C160 40 100 120 0 140 C-100 120 -160 40 -160 0 C-160 -40 -100 -120 0 -140 Z" fill="none" stroke="url(#middleGradient)" stroke-width="34" stroke-linecap="round" />
      </g>
      <g opacity="0.7">
        <ellipse cx="0" cy="0" rx="88" ry="220" fill="none" stroke="#00a6a6" stroke-width="12" stroke-dasharray="18 12" />
      </g>
      <g opacity="0.85">
        <ellipse cx="0" cy="0" rx="120" ry="300" fill="none" stroke="#1a3a5f" stroke-width="8" stroke-dasharray="16 16" transform="rotate(20)" />
      </g>
      <g opacity="0.45">
        <circle cx="0" cy="-150" r="14" fill="#00a6a6" />
        <circle cx="140" cy="-40" r="10" fill="#ffc107" />
        <circle cx="-110" cy="60" r="12" fill="#00a6a6" />
        <circle cx="70" cy="160" r="14" fill="#ffc107" />
      </g>
    </g>

    <g>
      <circle cx="0" cy="0" r="120" fill="url(#dotPattern)" opacity="0.35" />
      <circle cx="0" cy="0" r="82" fill="url(#heatPattern)" opacity="0.55" />
      <circle cx="0" cy="0" r="64" fill="url(#innerGradient)" />
      <path d="M-32 -12 L32 -12 L42 22 L-42 22 Z" fill="#ffffff" opacity="0.75" />
      <path d="M-30 20 Q0 50 30 20" stroke="#1a3a5f" stroke-width="4" fill="none" opacity="0.55" />
    </g>

    <g opacity="0.2" stroke="#06b6d4" stroke-width="2" stroke-dasharray="10 6">
      <circle cx="0" cy="0" r="200" fill="none" />
      <circle cx="0" cy="0" r="240" fill="none" />
      <circle cx="0" cy="0" r="150" fill="none" />
    </g>
  </g>

  <g font-family="'Eurostile', 'Montserrat', sans-serif" text-anchor="middle">
    <text x="400" y="500" font-size="70" fill="#e2e8f0" letter-spacing="8">SAFE<tspan fill="#00a6a6" font-weight="700">V</tspan>ISION</text>
    <text x="400" y="540" font-size="26" fill="#94a3b8" letter-spacing="6">Spatial Analysis &amp; Visualization</text>
  </g>
</svg>