<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="irisGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5f" />
      <stop offset="100%" stop-color="#152a45" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4682B4" />
      <stop offset="100%" stop-color="#C0C0C0" />
    </linearGradient>
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00d4d4" />
      <stop offset="100%" stop-color="#00a6a6" />
    </radialGradient>
    <pattern id="contourPattern" patternUnits="userSpaceOnUse" width="80" height="80">
      <path d="M0 40 Q40 0 80 40" stroke="#13253f" stroke-width="2" fill="none" opacity="0.3" />
      <path d="M0 60 Q40 20 80 60" stroke="#13253f" stroke-width="1" fill="none" opacity="0.2" />
    </pattern>
    <pattern id="gridPattern" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect x="0" y="0" width="40" height="40" fill="none" stroke="#1f2d3d" stroke-width="0.5" opacity="0.18" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#0f172a" />
  <rect x="0" y="0" width="800" height="600" fill="url(#gridPattern)" opacity="0.35" />

  <g transform="translate(400,260)">
    <g opacity="0.25">
      <circle cx="0" cy="0" r="210" fill="none" stroke="#1e2f49" stroke-width="8" stroke-dasharray="14 22" />
    </g>

    <g transform="rotate(-10)">
      <path d="M-220 0 A220 180 0 0 1 0 -220 A220 180 0 0 1 220 0 A220 180 0 0 1 0 220 A220 180 0 0 1 -220 0" fill="url(#contourPattern)" stroke="#0f1f33" stroke-width="12" />
      <circle cx="0" cy="0" r="150" fill="url(#irisGradient)" />
      <circle cx="0" cy="0" r="110" fill="none" stroke="#284a70" stroke-width="10" stroke-dasharray="22 16" opacity="0.6" />
      <circle cx="0" cy="0" r="90" fill="#102238" opacity="0.7" />
    </g>

    <g>
      <path d="M-180 -30 Q0 -150 180 -30 L160 110 Q0 180 -160 110 Z" fill="none" stroke="url(#shieldGradient)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
      <path d="M-150 -10 Q0 -120 150 -10 L130 90 Q0 160 -130 90 Z" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g>
      <circle cx="0" cy="0" r="70" fill="url(#centerGradient)" />
      <path d="M-20 -10 L20 -10 L28 18 L-28 18 Z" fill="#ffffff" opacity="0.75" />
      <circle cx="0" cy="0" r="16" fill="#ffc107" />
      <path d="M0 -38 Q28 0 0 38 Q-28 0 0 -38 Z" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" />
    </g>

    <g opacity="0.25" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="10 14">
      <circle cx="0" cy="0" r="190" fill="none" />
      <circle cx="0" cy="0" r="230" fill="none" />
    </g>
  </g>

  <g font-family="'Rajdhani', 'Montserrat', sans-serif" text-anchor="middle" letter-spacing="6">
    <text x="400" y="480" font-size="66" fill="#e2e8f0">S<tspan font-size="62" baseline-shift="0" fill="#00a6a6">▲</tspan>FEVISION</text>
    <text x="400" y="522" font-size="24" fill="#94a3b8" letter-spacing="8">Spatial Analysis &amp; Visualization</text>
  </g>
</svg>