<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00a6a6" />
      <stop offset="100%" stop-color="#ffc107" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <pattern id="dataDots" patternUnits="userSpaceOnUse" width="18" height="18">
      <circle cx="4" cy="4" r="2.5" fill="rgba(0,166,166,0.4)" />
      <circle cx="14" cy="12" r="2.5" fill="rgba(255,193,7,0.35)" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#skyGradient)" />

  <g transform="translate(120,100)">
    <path d="M280 0 L330 170 L330 260 L230 260 L230 170 Z" fill="#1a3a5f" opacity="0.92" />
    <path d="M230 170 L180 260 L130 260 L210 90 L230 170 Z" fill="#1a3a5f" opacity="0.88" />
    <path d="M330 170 L350 90 L430 260 L380 260 Z" fill="#1a3a5f" opacity="0.88" />
    <path d="M180 260 L430 260 L430 320 L180 320 Z" fill="#1a3a5f" opacity="0.95" />

    <path d="M280 0 L210 90 L430 260 L350 90 Z" fill="none" stroke="#00a6a6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" opacity="0.7" />

    <g opacity="0.25" fill="#1a3a5f">
      <rect x="90" y="320" width="470" height="140" fill="#ffffff" stroke="#dbeafe" stroke-width="2" rx="16" ry="16" />
      <rect x="120" y="340" width="410" height="18" fill="#dbeafe" rx="9" ry="9" />
    </g>

    <g transform="translate(120,320)">
      <rect x="0" y="0" width="80" height="120" fill="url(#chartGradient)" rx="12" ry="12" />
      <rect x="100" y="40" width="80" height="80" fill="url(#chartGradient)" opacity="0.8" rx="12" ry="12" />
      <rect x="200" y="20" width="80" height="100" fill="url(#chartGradient)" opacity="0.6" rx="12" ry="12" />
      <rect x="300" y="60" width="80" height="60" fill="url(#chartGradient)" opacity="0.5" rx="12" ry="12" />
      <polyline points="0,0 40,-40 120,-10 180,-60 260,-20 340,-70 380,-20" fill="none" stroke="#00a6a6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="40" cy="-40" r="10" fill="#00a6a6" />
      <circle cx="180" cy="-60" r="10" fill="#00a6a6" />
      <circle cx="340" cy="-70" r="10" fill="#ffc107" />
    </g>

    <clipPath id="landmarkClip">
      <path d="M280 0 L330 170 L330 260 L230 260 L230 170 Z" />
    </clipPath>
    <rect x="150" y="20" width="300" height="260" fill="url(#dataDots)" clip-path="url(#landmarkClip)" opacity="0.45" />
  </g>

  <g font-family="'Nunito', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="400" y="520" font-size="68" fill="#1a3a5f" font-weight="600">SafeVision</text>
    <text x="400" y="560" font-size="24" fill="#64748b" letter-spacing="3">Spatial Analysis &amp; Visualization</text>
  </g>
</svg>