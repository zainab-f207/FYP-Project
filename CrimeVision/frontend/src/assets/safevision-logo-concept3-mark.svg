<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" aria-hidden="true">
  <defs>
    <linearGradient id="eyeMk" x1="0" x2="1">
      <stop offset="0" stop-color="#1a3a5f"/>
      <stop offset="1" stop-color="#1a3a5f"/>
    </linearGradient>
    <linearGradient id="pupilMk" x1="0" x2="1">
      <stop offset="0" stop-color="#00a6a6"/>
      <stop offset="1" stop-color="#00d1d1"/>
