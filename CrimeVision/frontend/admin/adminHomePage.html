<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrimeVision: AI-Powered Crime Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/react@17/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0d2b4b; /* Deep navy blue */
            --primary: #1a4f72;
            --primary-light: #2d7fb8;
            --secondary: #f9a826; /* Golden yellow - Pakistan color */
            --accent: #ff6b6b; /* Coral red for alerts */
            --success: #1dd1a1; /* Teal green */
            --dark: #2d3436;
            --light: #f5f6fa;
            --gray: #dfe6e9;
            --sidebar-width: 280px;
            --sidebar-collapsed-width: 80px;
            --transition-speed: 0.4s;
            --card-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(to bottom, var(--primary-dark), var(--primary));
            color: white;
            height: 100vh;
            position: fixed;
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.15);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar-header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .sidebar-header h3 {
            font-size: 1.4rem;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity var(--transition-speed);
            font-weight: 600;
            background: linear-gradient(to right, #fff, var(--secondary));
             background-clip: text; 
  -webkit-background-clip: text; /* ✅ vendor prefix for Chrome/Safari */
  color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .sidebar.collapsed .sidebar-header h3 {
            opacity: 0;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: var(--secondary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 20px;
            transform: rotate(0deg);
            transition: transform 0.5s;
        }

        .sidebar:hover .logo {
            transform: rotate(360deg);
        }

        .sidebar-menu {
            list-style: none;
            padding: 20px 0;
            flex-grow: 1;
        }

        .sidebar-menu li {
            margin: 8px 0;
            position: relative;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 14px 25px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            transition: all 0.3s ease;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            border-left: 4px solid transparent;
        }

        .sidebar-menu a:hover {
            background: linear-gradient(90deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%);
            color: white;
            border-left: 4px solid var(--secondary);
        }

        .sidebar-menu a.active {
            background: linear-gradient(90deg, rgba(249,168,38,0.2) 0%, rgba(249,168,38,0.05) 100%);
            color: white;
            border-left: 4px solid var(--secondary);
        }

        .sidebar-menu a.active:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--secondary);
        }

        .sidebar-menu i {
            margin-right: 18px;
            font-size: 1.3rem;
            width: 24px;
            text-align: center;
            transition: transform 0.3s;
        }

        .sidebar-menu a:hover i {
            transform: scale(1.1);
        }

        .sidebar.collapsed .sidebar-menu span {
            opacity: 0;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(180deg);
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: margin-left var(--transition-speed);
            padding: 25px;
            background: transparent;
        }

        .main-content.expanded {
            margin-left: var(--sidebar-collapsed-width);
        }

        /* Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            padding: 18px 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.5s ease;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--light);
            border-radius: 50px;
            padding: 8px 20px;
            width: 350px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .search-bar:focus-within {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(45, 127, 184, 0.2);
        }

        .search-bar input {
            border: none;
            background: transparent;
            padding: 8px;
            width: 100%;
            outline: none;
            font-size: 0.95rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            padding: 8px 15px;
            border-radius: 50px;
        }

        .user-profile:hover {
            background: var(--light);
        }

        .user-profile img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
            border: 3px solid var(--primary-light);
        }

        .user-info {
            line-height: 1.4;
        }

        .user-info .role {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 500;
        }

        /* Dashboard Cards */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 100%);
            backdrop-filter: blur(10px);
            border-radius: var(--card-radius);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            padding: 25px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-header i {
            font-size: 2.2rem;
            color: var(--primary);
            background: rgba(26, 79, 114, 0.1);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .card:hover .card-header i {
            transform: scale(1.1);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .card-title {
            font-size: 1rem;
            color: #666;
            font-weight: 500;
        }

        .card-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--dark);
            margin: 10px 0;
        }

        .card-change {
            margin-top: 15px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }

        .positive {
            color: var(--success);
        }

        .negative {
            color: var(--accent);
        }

        /* Map Container */
        .map-container {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 100%);
            backdrop-filter: blur(10px);
            border-radius: var(--card-radius);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            padding: 25px;
            margin-bottom: 35px;
            height: 450px;
            animation: fadeIn 0.8s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .map-title {
            font-size: 1.4rem;
            color: var(--dark);
            font-weight: 600;
        }

        .map-controls {
            display: flex;
            gap: 12px;
        }

        .map-controls button {
            padding: 10px 20px;
            border-radius: 50px;
            border: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-filter {
            background: var(--light);
            color: var(--dark);
        }

        .btn-filter:hover {
            background: var(--primary-light);
            color: white;
        }

        .btn-refresh {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-refresh:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(26, 79, 114, 0.4);
        }

        .map-placeholder {
            background: linear-gradient(135deg, #e6e9f0 0%, #eef1f5 100%);
            height: 100%;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--dark);
            font-size: 1.3rem;
            overflow: hidden;
            position: relative;
        }

        .map-placeholder:before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.5), transparent);
            transform: rotate(45deg);
            animation: shimmer 2s infinite;
        }

        /* Recent Reports */
        .recent-reports {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 100%);
            backdrop-filter: blur(10px);
            border-radius: var(--card-radius);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            padding: 25px;
            animation: fadeIn 1s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.4rem;
            color: var(--dark);
            font-weight: 600;
        }

        .view-all {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .view-all:hover {
            color: var(--primary-dark);
            gap: 12px;
        }

        .report-list {
            list-style: none;
        }

        .report-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            transition: all 0.3s;
        }

        .report-item:hover {
            background: rgba(0, 0, 0, 0.02);
            transform: translateX(5px);
        }

        .report-item:last-child {
            border-bottom: none;
        }

        .report-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .report-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 18px;
            font-size: 1.4rem;
            transition: all 0.3s;
        }

        .report-item:hover .report-icon {
            transform: scale(1.1);
        }

        .theft {
            background: linear-gradient(135deg, rgba(255,107,107,0.2) 0%, rgba(255,107,107,0.1) 100%);
            color: var(--accent);
        }

        .assault {
            background: linear-gradient(135deg, rgba(249,168,38,0.2) 0%, rgba(249,168,38,0.1) 100%);
            color: var(--secondary);
        }

        .burglary {
            background: linear-gradient(135deg, rgba(29,209,161,0.2) 0%, rgba(29,209,161,0.1) 100%);
            color: var(--success);
        }

        .report-details h4 {
            font-size: 1.05rem;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .report-details p {
            font-size: 0.9rem;
            color: #666;
        }

        .report-status {
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .status-high {
            background: linear-gradient(135deg, rgba(255,107,107,0.2) 0%, rgba(255,107,107,0.1) 100%);
            color: var(--accent);
        }

        .status-medium {
            background: linear-gradient(135deg, rgba(249,168,38,0.2) 0%, rgba(249,168,38,0.1) 100%);
            color: var(--secondary);
        }

        .status-low {
            background: linear-gradient(135deg, rgba(29,209,161,0.2) 0%, rgba(29,209,161,0.1) 100%);
            color: var(--success);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .fade-in {
            animation: fadeIn 0.6s ease;
        }

        /* Pulse animation for alerts */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .dashboard-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 992px) {
            .sidebar {
                width: var(--sidebar-collapsed-width);
                transform: translateX(0);
            }
            
            .sidebar-header h3 {
                opacity: 0;
            }
            
            .sidebar-menu span {
                opacity: 0;
                width: 0;
                height: 0;
                overflow: hidden;
            }
            
            .main-content {
                margin-left: var(--sidebar-collapsed-width);
            }
            
            .search-bar {
                width: 250px;
            }
        }

        @media (max-width: 768px) {
            .dashboard-cards {
                grid-template-columns: 1fr;
            }
            
            .search-bar {
                width: 200px;
            }
            
            .navbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .search-bar {
                width: 100%;
            }
        }

        @media (max-width: 576px) {
            .sidebar {
                width: 0;
                overflow: hidden;
            }
            
            .main-content {
                margin-left: 0;
                padding: 15px;
            }
            
            .sidebar.mobile-open {
                width: var(--sidebar-width);
                z-index: 1100;
            }
            
            .sidebar.mobile-open .sidebar-header h3 {
                opacity: 1;
            }
            
            .sidebar.mobile-open .sidebar-menu span {
                opacity: 1;
                width: auto;
                height: auto;
            }
            
            .mobile-toggle {
                display: block;
                position: fixed;
                top: 20px;
                left: 20px;
                z-index: 1200;
                background: var(--primary);
                color: white;
                border: none;
                border-radius: 50%;
                width: 45px;
                height: 45px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .map-controls {
                flex-direction: column;
                width: 100%;
            }
            
            .map-controls button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
            const [recentReports, setRecentReports] = useState([]);
            const [activeItem, setActiveItem] = useState('dashboard');

            useEffect(() => {
                // Simulate fetching recent reports
                const mockReports = [
                    { id: 1, type: 'theft', title: 'Car Theft', location: 'Gulberg, Lahore', time: '2 hours ago', risk: 'high' },
                    { id: 2, type: 'assault', title: 'Street Fight', location: 'Model Town, Lahore', time: '5 hours ago', risk: 'medium' },
                    { id: 3, type: 'burglary', title: 'House Break-in', location: 'Johar Town, Lahore', time: '12 hours ago', risk: 'high' },
                    { id: 4, type: 'theft', title: 'Phone Snatching', location: 'Iqbal Town, Lahore', time: '1 day ago', risk: 'medium' },
                    { id: 5, type: 'assault', title: 'Robbery', location: 'DHA, Lahore', time: '2 days ago', risk: 'low' }
                ];
                setRecentReports(mockReports);
            }, []);

            const toggleSidebar = () => {
                setSidebarCollapsed(!sidebarCollapsed);
            };

            const toggleMobileSidebar = () => {
                setMobileSidebarOpen(!mobileSidebarOpen);
            };

            const handleNavItemClick = (item) => {
                setActiveItem(item);
                if (window.innerWidth < 576) {
                    setMobileSidebarOpen(false);
                }
            };

            return (
                <div className="app-container">
                    <button className="mobile-toggle d-md-none" onClick={toggleMobileSidebar}>
                        <i className="fas fa-bars"></i>
                    </button>
                    
                    <div className={`sidebar ${sidebarCollapsed ? 'collapsed' : ''} ${mobileSidebarOpen ? 'mobile-open' : ''}`}>
                        <div className="sidebar-header">
                            <div className="logo">
                                <i className="fas fa-shield-alt"></i>
                            </div>
                            <h3>CrimeVision AI</h3>
                        </div>
                        <ul className="sidebar-menu">
                            <li>
                                <a href="#" className={activeItem === 'dashboard' ? 'active' : ''} onClick={() => handleNavItemClick('dashboard')}>
                                    <i className="fas fa-home"></i>
                                    <span>Dashboard</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" className={activeItem === 'heatmap' ? 'active' : ''} onClick={() => handleNavItemClick('heatmap')}>
                                    <i className="fas fa-map-marked-alt"></i>
                                    <span>Heat Map</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" className={activeItem === 'predictions' ? 'active' : ''} onClick={() => handleNavItemClick('predictions')}>
                                    <i className="fas fa-chart-line"></i>
                                    <span>Predictions</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" className={activeItem === 'reports' ? 'active' : ''} onClick={() => handleNavItemClick('reports')}>
                                    <i className="fas fa-exclamation-circle"></i>
                                    <span>Reports</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" className={activeItem === 'alerts' ? 'active' : ''} onClick={() => handleNavItemClick('alerts')}>
                                    <i className="fas fa-bell pulse"></i>
                                    <span>Alerts</span>
                                </a>
                            </li>
                            <li>
                                <a href="#" className={activeItem === 'settings' ? 'active' : ''} onClick={() => handleNavItemClick('settings')}>
                                    <i className="fas fa-cog"></i>
                                    <span>Settings</span>
                                </a>
                            </li>
                        </ul>
                        <div className="sidebar-footer">
                            <a href="#" className={activeItem === 'logout' ? 'active' : ''} onClick={() => handleNavItemClick('logout')}>
                                <i className="fas fa-sign-out-alt"></i>
                                <span>Logout</span>
                            </a>
                            <button className="toggle-btn" onClick={toggleSidebar}>
                                <i className={`fas fa-chevron-${sidebarCollapsed ? 'right' : 'left'}`}></i>
                            </button>
                        </div>
                    </div>
                    
                    <div className={`main-content ${sidebarCollapsed ? 'expanded' : ''}`}>
                        <div className="navbar">
                            <div className="search-bar">
                                <i className="fas fa-search"></i>
                                <input type="text" placeholder="Search for locations or crimes..." />
                            </div>
                            <div className="user-profile">
                                <img src="https://ui-avatars.com/api/?name=Admin+User&background=1a4f72&color=fff" alt="User" />
                                <div className="user-info">
                                    <div>Admin User</div>
                                    <small className="role">Lahore Police</small>
                                </div>
                            </div>
                        </div>
                        
                        <div className="dashboard-cards">
                            <div className="card fade-in">
                                <div className="card-header">
                                    <h4 className="card-title">Total Crimes Reported</h4>
                                    <i className="fas fa-exclamation-triangle"></i>
                                </div>
                                <div className="card-value">1,248</div>
                                <div className="card-change positive">
                                    <i className="fas fa-arrow-down"></i> 12% decrease from last month
                                </div>
                            </div>
                            <div className="card fade-in">
                                <div className="card-header">
                                    <h4 className="card-title">Predicted High Risk Areas</h4>
                                    <i className="fas fa-map-marker-alt"></i>
                                </div>
                                <div className="card-value">18</div>
                                <div className="card-change negative">
                                    <i className="fas fa-arrow-up"></i> 3 new areas this week
                                </div>
                            </div>
                            <div className="card fade-in">
                                <div className="card-header">
                                    <h4 className="card-title">Alerts Sent</h4>
                                    <i className="fas fa-bell"></i>
                                </div>
                                <div className="card-value">327</div>
                                <div className="card-change positive">
                                    <i className="fas fa-check-circle"></i> 98% successfully delivered
                                </div>
                            </div>
                            <div className="card fade-in">
                                <div className="card-header">
                                    <h4 className="card-title">Prevention Rate</h4>
                                    <i className="fas fa-shield-alt"></i>
                                </div>
                                <div className="card-value">42%</div>
                                <div className="card-change positive">
                                    <i className="fas fa-arrow-up"></i> 8% improvement
                                </div>
                            </div>
                        </div>
                        
                        <div className="map-container fade-in">
                            <div className="map-header">
                                <h3 className="map-title">Lahore Crime Heatmap</h3>
                                <div className="map-controls">
                                    <button className="btn-filter">
                                        <i className="fas fa-filter"></i> Filter
                                    </button>
                                    <button className="btn-refresh">
                                        <i className="fas fa-sync-alt"></i> Refresh
                                    </button>
                                </div>
                            </div>
                            <div className="map-placeholder">
                                <div>
                                    <i className="fas fa-map-marked-alt fa-3x mb-3"></i>
                                    <p>Interactive Heatmap Loading...</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="recent-reports fade-in">
                            <div className="section-header">
                                <h3 className="section-title">Recent Crime Reports</h3>
                                <a href="#" className="view-all">View All <i className="fas fa-chevron-right"></i></a>
                            </div>
                            <ul className="report-list">
                                {recentReports.map(report => (
                                    <li key={report.id} className="report-item">
                                        <div className="report-info">
                                            <div className={`report-icon ${report.type}`}>
                                                <i className={`fas fa-${report.type === 'theft' ? 'gem' : report.type === 'assault' ? 'fist-raised' : 'house-damage'}`}></i>
                                            </div>
                                            <div className="report-details">
                                                <h4>{report.title}</h4>
                                                <p>{report.location} • {report.time}</p>
                                            </div>
                                        </div>
                                        <div className={`report-status status-${report.risk}`}>
                                            {report.risk.toUpperCase()} RISK
                                        </div>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
